<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 105" width="100%" height="100%">
  <defs>
    <!-- Card Surface Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Card 1 (CGPA) Cyan Accent -->
    <linearGradient id="metric1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Card 2 (LeetCode) Gold Accent -->
    <linearGradient id="metric2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Card 3 (Tata Power MAPE) Emerald Accent -->
    <linearGradient id="metric3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Card 4 (JEE Main) Purple Accent -->
    <linearGradient id="metric4Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- CARD 1: CGPA -->
  <g transform="translate(8, 6)">
    <rect width="208" height="92" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M 0 12 Q 0 0 12 0 L 208 0" stroke="url(#metric1Grad)" stroke-width="2.5" fill="none"/>
    <text x="20" y="42" fill="url(#metric1Grad)" font-size="28" font-weight="800" class="sans" letter-spacing="-0.5">9.83</text>
    <text x="20" y="63" fill="#E2E8F0" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">CUMULATIVE CGPA</text>
    <text x="20" y="78" fill="#64748B" font-size="10" font-weight="500" class="sans">K.J. Somaiya IT · Sem II &amp; IV: 10.0</text>
  </g>

  <!-- CARD 2: LEETCODE (Locked to 250) -->
  <g transform="translate(232, 6)">
    <rect width="208" height="92" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M 0 12 Q 0 0 12 0 L 208 0" stroke="url(#metric2Grad)" stroke-width="2.5" fill="none"/>
    <text x="20" y="42" fill="url(#metric2Grad)" font-size="28" font-weight="800" class="sans" letter-spacing="-0.5">250</text>
    <text x="20" y="63" fill="#E2E8F0" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">LEETCODE PROBLEMS</text>
    <text x="20" y="78" fill="#64748B" font-size="10" font-weight="500" class="sans">Core DSA Topics Mastered</text>
  </g>

  <!-- CARD 3: TATA POWER MAPE -->
  <g transform="translate(456, 6)">
    <rect width="208" height="92" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M 0 12 Q 0 0 12 0 L 208 0" stroke="url(#metric3Grad)" stroke-width="2.5" fill="none"/>
    <text x="20" y="42" fill="url(#metric3Grad)" font-size="28" font-weight="800" class="sans" letter-spacing="-0.5">3.573%</text>
    <text x="20" y="63" fill="#E2E8F0" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">FORECAST MAPE</text>
    <text x="20" y="78" fill="#64748B" font-size="10" font-weight="500" class="sans">Tata Power · 3M+ Weather Records</text>
  </g>

  <!-- CARD 4: JEE MAIN -->
  <g transform="translate(680, 6)">
    <rect width="208" height="92" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2"/>
    <path d="M 0 12 Q 0 0 12 0 L 208 0" stroke="url(#metric4Grad)" stroke-width="2.5" fill="none"/>
    <text x="20" y="42" fill="url(#metric4Grad)" font-size="28" font-weight="800" class="sans" letter-spacing="-0.5">96th %ile</text>
    <text x="20" y="63" fill="#E2E8F0" font-size="10.5" font-weight="700" class="mono" letter-spacing="1">JEE MAIN 2024</text>
    <text x="20" y="78" fill="#64748B" font-size="10" font-weight="500" class="sans">Top Rank Among ~1.4M Candidates</text>
  </g>
</svg>