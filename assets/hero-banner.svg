<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0D1322"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Ambient Glow Gradients -->
    <radialGradient id="glowTopRight" cx="90%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1322" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="10%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#0D1322" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#A855F7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
      <circle cx="30" cy="0" r="1" fill="#475569" fill-opacity="0.35"/>
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .pulse-dot {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="270" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="270" rx="16" fill="url(#glowTopRight)"/>
  <rect width="900" height="270" rx="16" fill="url(#glowBottomLeft)"/>
  <rect width="900" height="270" rx="16" fill="url(#techGrid)"/>
  <rect width="900" height="270" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Accent Highlight -->
  <path d="M 16 1.5 L 884 1.5" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Corner Tech Accents -->
  <g stroke="#475569" stroke-width="1" opacity="0.6">
    <path d="M 28 28 L 38 28 M 28 28 L 28 38"/>
    <path d="M 872 28 L 862 28 M 872 28 L 872 38"/>
    <path d="M 28 242 L 38 242 M 28 242 L 28 232"/>
    <path d="M 872 242 L 862 242 M 872 242 L 872 232"/>
  </g>

  <!-- Location & System Coordinates -->
  <text x="852" y="44" text-anchor="end" fill="#64748B" font-size="11" class="mono" letter-spacing="1">MUMBAI, IN // 19.0760° N, 72.8777° E</text>

  <!-- Status Pill Badge -->
  <g transform="translate(48, 32)">
    <rect width="270" height="26" rx="13" fill="#0F172A" stroke="url(#badgeBorder)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10B981" class="pulse-dot"/>
    <circle cx="14" cy="13" r="8" fill="#10B981" fill-opacity="0.2"/>
    <text x="26" y="17" fill="#38BDF8" font-size="10.5" font-weight="600" class="mono" letter-spacing="0.8">OPEN TO ROLES · SOFTWARE &amp; ML</text>
  </g>

  <!-- Main Identity: Full Name -->
  <text x="48" y="112" fill="url(#nameGrad)" font-size="44" font-weight="800" class="sans" letter-spacing="-0.8">Himesh Popat</text>

  <!-- Role Pipeline -->
  <text x="48" y="146" fill="#38BDF8" font-size="14.5" font-weight="600" class="sans" letter-spacing="0.2">
    Software Developer <tspan fill="#64748B">•</tspan> <tspan fill="#F8FAFC">Intern @IMD</tspan> <tspan fill="#64748B">•</tspan> <tspan fill="#F8FAFC">Intern @Tata Power Mumbai</tspan> <tspan fill="#64748B">•</tspan> <tspan fill="#94A3B8">B.Tech IT @KJSIT</tspan>
  </text>

  <!-- Mission Statement / Bio -->
  <g transform="translate(48, 182)">
    <!-- Decorative vertical bracket -->
    <rect x="0" y="0" width="3" height="42" rx="1.5" fill="url(#accentLine)"/>
    <text x="14" y="16" fill="#CBD5E1" font-size="13.5" font-weight="400" class="sans" letter-spacing="0.1">
      Passionate about building scalable software, applying machine learning to real-world problems,
    </text>
    <text x="14" y="36" fill="#94A3B8" font-size="13.5" font-weight="400" class="sans" letter-spacing="0.1">
      and strengthening problem-solving through Data Structures &amp; Algorithms.
    </text>
  </g>

  <!-- Bottom Right System Tag -->
  <text x="852" y="244" text-anchor="end" fill="#475569" font-size="11" class="mono" letter-spacing="1">SYSTEMS · ML PIPELINES · DSA</text>
</svg>