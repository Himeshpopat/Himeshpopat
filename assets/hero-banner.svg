<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%" role="img" aria-label="Himesh Popat — Software Developer">
  <defs>
    <!-- Deep Obsidian Architectural Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="45%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>

    <!-- Atmospheric Telemetry Glows -->
    <radialGradient id="glowTopRight" cx="88%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A101D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBottomLeft" cx="12%" cy="88%" r="50%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#0A101D" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Spectrum Accent Line -->
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#6366F1" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Status Pill Border -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Waveform Forecast Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="waveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A101D" stop-opacity="0"/>
    </linearGradient>

    <!-- Precision Isometric Engineering Grid -->
    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.55"/>
      <circle cx="28" cy="0" r="0.9" fill="#475569" fill-opacity="0.45"/>
    </pattern>

    <style>
      .pulse-dot {
        animation: pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="280" rx="16" fill="url(#glowTopRight)"/>
  <rect width="900" height="280" rx="16" fill="url(#glowBottomLeft)"/>
  <rect width="900" height="280" rx="16" fill="url(#techGrid)"/>

  <!-- Atmospheric & Telemetry Harmonic Curve (Right-side background visual motif) -->
  <g opacity="0.85">
    <path d="M 480 220 C 550 215, 590 150, 650 165 C 710 180, 740 105, 800 115 C 835 120, 860 75, 884 70 L 884 250 L 480 250 Z" fill="url(#waveArea)"/>
    <path d="M 480 220 C 550 215, 590 150, 650 165 C 710 180, 740 105, 800 115 C 835 120, 860 75, 884 70" fill="none" stroke="url(#waveGrad)" stroke-width="2"/>
    <path d="M 520 232 C 580 225, 620 175, 675 182 C 730 189, 765 130, 820 135 C 850 138, 870 95, 884 90" fill="none" stroke="#6366F1" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="3 3"/>
    <circle cx="650" cy="165" r="3" fill="#38BDF8" fill-opacity="0.5"/>
    <circle cx="800" cy="115" r="3.5" fill="#6366F1" fill-opacity="0.7"/>
    <circle cx="860" cy="82" r="4" fill="#10B981" fill-opacity="0.85"/>
  </g>

  <!-- Crisp Inner & Outer Structural Borders -->
  <rect x="0.75" y="0.75" width="898.5" height="278.5" rx="15.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="10" y="10" width="880" height="260" rx="10" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Top Spectrum Highlight Bar -->
  <path d="M 20 1.5 L 880 1.5" stroke="url(#accentLine)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Precision Corner Reticles -->
  <g stroke="#475569" stroke-width="1.2" opacity="0.7">
    <path d="M 24 24 L 36 24 M 24 24 L 24 36"/>
    <path d="M 876 24 L 864 24 M 876 24 L 876 36"/>
    <path d="M 24 256 L 36 256 M 24 256 L 24 244"/>
    <path d="M 876 256 L 864 256 M 876 256 L 876 244"/>
  </g>

  <!-- Location & Geodetic Coordinates -->
  <text x="856" y="45" text-anchor="end" fill="#94A3B8" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, DejaVu Sans Mono, monospace" letter-spacing="1.2">MUMBAI, IN // 19.0760° N, 72.8777° E</text>

  <!-- Status Pill Badge -->
  <g transform="translate(44, 28)">
    <rect width="276" height="26" rx="13" fill="#0B1120" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <circle cx="15" cy="13" r="4" fill="#10B981" class="pulse-dot"/>
    <circle cx="15" cy="13" r="8" fill="#10B981" fill-opacity="0.22"/>
    <text x="28" y="17" fill="#38BDF8" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, DejaVu Sans Mono, monospace" letter-spacing="0.9">OPEN TO ROLES · SOFTWARE &amp; ML</text>
  </g>

  <!-- Main Identity: Full Name -->
  <text x="44" y="110" fill="#F8FAFC" font-size="46" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Lato, DejaVu Sans, sans-serif" letter-spacing="-1.1">Himesh Popat</text>

  <!-- Role Pipeline with High-Contrast Highlights -->
  <text x="44" y="145" fill="#38BDF8" font-size="14.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Lato, DejaVu Sans, sans-serif" letter-spacing="0.2">
    Software Developer <tspan fill="#64748B">•</tspan> <tspan fill="#F8FAFC">Intern @IMD</tspan> <tspan fill="#64748B">•</tspan> <tspan fill="#F8FAFC">Intern @Tata Power Mumbai</tspan> <tspan fill="#64748B">•</tspan> <tspan fill="#94A3B8">B.Tech IT @KJSIT</tspan>
  </text>

  <!-- Mission Statement / Bio Callout Box -->
  <g transform="translate(44, 178)">
    <rect x="0" y="0" width="690" height="54" rx="8" fill="#0F172A" fill-opacity="0.65" stroke="#1E293B" stroke-width="1"/>
    <rect x="0" y="6" width="3.5" height="42" rx="1.75" fill="url(#accentLine)"/>
    <text x="16" y="22" fill="#E2E8F0" font-size="13.5" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Lato, DejaVu Sans, sans-serif" letter-spacing="0.1">
      Passionate about building scalable software, applying machine learning to real-world problems,
    </text>
    <text x="16" y="42" fill="#94A3B8" font-size="13.5" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Lato, DejaVu Sans, sans-serif" letter-spacing="0.1">
      and strengthening problem-solving through Data Structures &amp; Algorithms.
    </text>
  </g>

  <!-- Bottom Right System Tag -->
  <text x="856" y="252" text-anchor="end" fill="#64748B" font-size="10.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, DejaVu Sans Mono, monospace" letter-spacing="1.2">SYSTEMS · ML PIPELINES · DSA</text>
</svg>
